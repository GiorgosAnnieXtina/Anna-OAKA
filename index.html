<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><link rel="manifest" href="./manifest.webmanifest">
<title>Song Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { font-family:"Josefin Sans",sans-serif; color-scheme:dark; background:#000; }
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#000; color:#fff; font-family:"Josefin Sans",sans-serif; }
button,input,select { font:inherit; }
.screen { min-height:100svh; background:#000; }
.home {
  min-height:100svh; position:relative; display:flex; align-items:flex-end;
  padding:24px 18px calc(22px + env(safe-area-inset-bottom));
  background-image:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05) 58%),url("homepage-bg.png");
  background-size:cover; background-position:center;
}
.controls { width:100%; display:grid; gap:10px; }
.search {
  width:100%; border:1px solid rgba(255,255,255,.3); border-radius:12px;
  background:rgba(0,0,0,.65); color:#fff; padding:14px 16px; outline:none;
  backdrop-filter:blur(8px);
}
.search::placeholder { color:rgba(255,255,255,.75); }
.select {
  width:100%; border:1px solid rgba(255,255,255,.3); border-radius:12px;
  background:rgba(0,0,0,.78); color:#fff; padding:14px 16px; outline:none;
}
.song { min-height:100svh; padding:28px 18px 38px; background:#000; }
.topbar { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.back {
  border:0; background:#fff; color:#000; border-radius:999px; width:42px; height:42px;
  font-size:22px; cursor:pointer;
}
.heading { margin:0; font-size:clamp(22px,6vw,34px); line-height:1.15; font-weight:600; }
.lyrics {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;
  align-items:start;
}
.panel {
  min-width:0; padding:18px 14px; border:1px solid rgba(255,255,255,.14);
  border-radius:14px; background:#080808;
}
.panel h2 { margin:0 0 16px; font-size:15px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.08em; }
.text { white-space:pre-wrap; font-size:clamp(17px,4.5vw,22px); line-height:1.55; }
.video { margin-top:22px; }
.video a { color:#fff; }
.video iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:14px; background:#111; }
.empty { opacity:.6; text-align:center; padding:24px; }
@media (max-width:640px) {
  .lyrics { grid-template-columns:1fr 1fr; gap:8px; }
  .panel { padding:14px 10px; }
  .text { font-size:15px; line-height:1.5; }
}

.admin-gear{
 position:fixed; top:calc(12px + env(safe-area-inset-top)); right:12px; z-index:9999;
 width:48px;height:48px;border:1px solid rgba(255,255,255,.35);border-radius:50%;
 background:rgba(0,0,0,.78);color:#fff;font-size:24px;display:flex;align-items:center;
 justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.45);
}
.admin-overlay{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.88);display:none;
 overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom));}
.admin-card{max-width:560px;margin:30px auto 0;background:#111;border:1px solid #333;border-radius:18px;padding:20px;}
.admin-card h2{margin:0 0 18px;font-size:24px}
.admin-card label{display:block;margin:12px 0 6px;opacity:.8;font-size:14px}
.admin-card input,.admin-card textarea{width:100%;border:1px solid #444;border-radius:10px;background:#050505;color:#fff;padding:12px;font:inherit}
.admin-card textarea{min-height:110px;resize:vertical}
.admin-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.admin-actions button{border:0;border-radius:10px;padding:13px;font:inherit;font-weight:600;cursor:pointer}
.admin-close{background:#333;color:#fff}.admin-save{background:#fff;color:#000}
.admin-download{width:100%;margin-top:10px;background:#fff;color:#000}
.admin-msg{min-height:22px;margin-top:12px;font-size:14px}

</head>
<body>
<div id="app" class="screen"></div>
<button id="adminGear" class="admin-gear" type="button" aria-label="Add song" title="Add song">⚙️</button>
<div id="adminOverlay" class="admin-overlay" aria-hidden="true">
 <div class="admin-card">
  <h2>Add song</h2>
  <label>Title</label><input id="aTitle" type="text" autocomplete="off">
  <label>Transliteration</label><input id="aTranslit" type="text" autocomplete="off">
  <label>Portuguese title</label><input id="aPtTitle" type="text" autocomplete="off">
  <label>Transliterated lyrics</label><textarea id="aLyrics"></textarea>
  <label>Portuguese lyrics</label><textarea id="aPtLyrics"></textarea>
  <label>YouTube URL</label><input id="aVideo" type="url" placeholder="https://www.youtube.com/watch?v=...">
  <div class="admin-actions">
   <button id="aClose" class="admin-close" type="button">Close</button>
   <button id="aSave" class="admin-save" type="button">Add song</button>
  </div>
  <button id="aDownload" class="admin-download" type="button">Download updated songs.json</button>
  <div id="aMsg" class="admin-msg"></div>
 </div>
</div><button id="installBtn" style="display:none;position:fixed;right:16px;bottom:16px;z-index:20;border:0;border-radius:999px;padding:12px 16px;background:#fff;color:#000;font-family:inherit;font-weight:600;">Add to Home Screen</button>
<script>
let songs = [];
const app = document.getElementById("app");

function youtubeId(url) {
  if (!url) return "";
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([^?&/]+)/i);
  return m ? m[1] : "";
}

function home(filtered=songs, query="") {
  app.innerHTML = `
    <main class="home">
      <div class="controls">
        <input id="search" class="search" type="search" placeholder="Search songs..." value="${escapeAttr(query)}">
        <select id="songSelect" class="select">
          <option value="">Select a song</option>
          ${filtered.map((s,i)=>`<option value="${songs.indexOf(s)}">${escapeHtml(s.title.trim())}</option>`).join("")}
        </select>
      </div>
    </main>`;
  const search = document.getElementById("search");
  const select = document.getElementById("songSelect");
  search.addEventListener("input", () => {
    const q = search.value.toLowerCase().trim();
    const f = songs.filter(s => [s.title,s.translit,s.portuguese_title].some(v => v.toLowerCase().includes(q)));
    home(f, search.value);
    document.getElementById("search").focus();
    document.getElementById("search").setSelectionRange(q.length,q.length);
  });
  select.addEventListener("change", () => {
    if (select.value !== "") showSong(Number(select.value));
  });
}

function showSong(index) {
  const s = songs[index];
  const id = youtubeId(s.video);
  app.innerHTML = `
    <main class="song">
      <div class="topbar">
        <button type="button" class="back" aria-label="Back to home">‹</button>
        <h1 class="heading">${escapeHtml(s.title.trim())} — ${escapeHtml(s.translit.trim())} (${escapeHtml(s.portuguese_title.trim())})</h1>
      </div>
      <section class="lyrics">
        <article class="panel">
          <h2>Transcription</h2>
          <div class="text">${escapeHtml(s.translit_lyrics)}</div>
        </article>
        <article class="panel">
          <h2>Portuguese</h2>
          <div class="text">${escapeHtml(s.portuguese_lyrics)}</div>
        </article>
      </section>
      ${id ? `<div class="video"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>` : ""}
    </main>`;
  app.querySelector(".back").onclick = function(e) { e.preventDefault(); home(); window.scrollTo(0, 0); };
}

function escapeHtml(v) {
  return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(v) { return escapeHtml(v); }


const adminGear = document.getElementById("adminGear");
const adminOverlay = document.getElementById("adminOverlay");
const aMsg = document.getElementById("aMsg");
function openAdmin(){
  adminOverlay.style.display="block"; adminOverlay.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden"; document.getElementById("aTitle").focus();
}
function closeAdmin(){
  adminOverlay.style.display="none"; adminOverlay.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
}
adminGear.addEventListener("click", openAdmin);
document.getElementById("aClose").addEventListener("click", closeAdmin);
adminOverlay.addEventListener("click", e => { if(e.target===adminOverlay) closeAdmin(); });
document.getElementById("aSave").addEventListener("click", () => {
  const s = {
    title: document.getElementById("aTitle").value.trim(),
    translit: document.getElementById("aTranslit").value.trim(),
    portuguese_title: document.getElementById("aPtTitle").value.trim(),
    translit_lyrics: document.getElementById("aLyrics").value,
    portuguese_lyrics: document.getElementById("aPtLyrics").value,
    video: document.getElementById("aVideo").value.trim()
  };
  if(!s.title){ aMsg.textContent="Please enter a title."; return; }
  songs.push(s);
  localStorage.setItem("songLibraryLocal", JSON.stringify(songs));
  home();
  ["aTitle","aTranslit","aPtTitle","aLyrics","aPtLyrics","aVideo"].forEach(id=>document.getElementById(id).value="");
  aMsg.textContent="Song added on this device. Download songs.json and replace the GitHub file to publish it.";
});
document.getElementById("aDownload").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(songs,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download="songs.json"; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});

fetch("./songs.json")
  .then(r => r.json())
  .then(data => { songs = JSON.parse(localStorage.getItem("songLibraryLocal") || "null") || data; home(); })
  .catch(() => { app.innerHTML = '<main class="song"><div class="empty">Could not load songs.json.</div></main>'; });

let deferredInstallPrompt = null;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.style.display = "block";
});
installBtn.addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.style.display = "none";
});
window.addEventListener("appinstalled", () => {
  installBtn.style.display = "none";
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
